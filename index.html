<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become an English Vocabulary Genius!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #3157a4;
            margin-bottom: 10px;
        }

        h2 {
            color: #3157a4;
        }

        p {
            line-height: 1.6;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            margin: 7px;
            font-size: 16px;
            cursor: pointer;
            background-color: #dce7ff;
            color: #3157a4;
        }

        button:hover {
            background-color: #c7d8ff;
        }

        .menu-button {
            display: block;
            width: 80%;
            margin: 15px auto;
            background-color: #3157a4;
            color: white;
        }

        .menu-button:hover {
            background-color: #264786;
        }

        .level-button {
            width: 80%;
            background-color: white;
            border: 1px solid #3157a4;
        }

        .level-button:hover {
            background-color: #eef3ff;
        }

        .answer-button {
            display: block;
            width: 90%;
            margin: 10px auto;
            background-color: #eef3ff;
        }

        .answer-button:hover {
            background-color: #dce7ff;
        }

        .hidden {
            display: none;
        }

        .word {
            font-size: 36px;
            font-weight: bold;
            color: #3157a4;
            margin: 25px 0 10px;
        }

        .meaning {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .example {
            background-color: #f4f7fb;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .speaker-button {
            background-color: white;
            border: 1px solid #3157a4;
            color: #3157a4;
        }

        .favorite {
            font-size: 28px;
            background: none;
            padding: 5px 10px;
        }

        .feedback {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            min-height: 28px;
        }

        .progress {
            color: #777;
            margin-bottom: 10px;
        }

        .wrong-word {
            background-color: #fff3f3;
            border: 1px solid #ffcccc;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: left;
        }

        .favorite-word {
            background-color: #fffaf0;
            border: 1px solid #f0d890;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: left;
        }

        .small-button {
            font-size: 14px;
            padding: 8px 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="homeScreen">
        <h1>Become an English<br>Vocabulary Genius!</h1>
        <p>영어 단어를 재미있게 공부해 보세요.</p>

        <button class="menu-button" onclick="showStudyLevel()">
            📚 Word Study
        </button>

        <button class="menu-button" onclick="showPracticeLevel()">
            📝 Practice
        </button>

        <button class="menu-button" onclick="showFavorites()">
            ⭐ Favorites
        </button>
    </div>


    <!-- STUDY LEVEL -->
    <div id="studyLevelScreen" class="hidden">
        <h2>📚 Word Study</h2>
        <p>공부할 레벨을 선택하세요.</p>

        <button class="level-button" onclick="startStudy(1)">
            ★ Level 1
        </button>

        <button class="level-button" onclick="startStudy(2)">
            ★★ Level 2
        </button>

        <button class="level-button" onclick="startStudy(3)">
            ★★★ Level 3
        </button>

        <button class="level-button" onclick="startStudy(4)">
            ★★★★ Level 4
        </button>

        <button class="level-button" onclick="startStudy(5)">
            ★★★★★ Level 5
        </button>

        <br>

        <button onclick="goHome()">← Home</button>
    </div>


    <!-- STUDY -->
    <div id="studyScreen" class="hidden">

        <div class="progress" id="studyProgress"></div>

        <div class="word" id="studyWord"></div>

        <button class="favorite" id="favoriteButton" onclick="toggleFavorite()">
            ☆
        </button>

        <div class="meaning" id="studyMeaning"></div>

        <div class="example">
            <strong>Example</strong>
            <p id="studyExample"></p>
            <p id="studyExampleMeaning"></p>
        </div>

        <button class="speaker-button" onclick="speakWord()">
            🔊 단어 듣기
        </button>

        <button class="speaker-button" onclick="speakExample()">
            🔊 예문 듣기
        </button>

        <br>

        <button onclick="previousStudy()">← 이전</button>
        <button onclick="nextStudy()">다음 →</button>

        <br>

        <button onclick="goHome()">🏠 Home</button>
    </div>


    <!-- PRACTICE LEVEL -->
    <div id="practiceLevelScreen" class="hidden">
        <h2>📝 Practice</h2>
        <p>연습할 레벨을 선택하세요.</p>

        <button class="level-button" onclick="choosePracticeType(1)">
            ★ Level 1
        </button>

        <button class="level-button" onclick="choosePracticeType(2)">
            ★★ Level 2
        </button>

        <button class="level-button" onclick="choosePracticeType(3)">
            ★★★ Level 3
        </button>

        <button class="level-button" onclick="choosePracticeType(4)">
            ★★★★ Level 4
        </button>

        <button class="level-button" onclick="choosePracticeType(5)">
            ★★★★★ Level 5
        </button>

        <br>

        <button onclick="goHome()">← Home</button>
    </div>


    <!-- PRACTICE TYPE -->
    <div id="practiceTypeScreen" class="hidden">
        <h2>무엇을 공부할까요?</h2>

        <button class="menu-button" onclick="startPractice('engToKor')">
            🇺🇸 영어 → 뜻
        </button>

        <button class="menu-button" onclick="startPractice('korToEng')">
            🇰🇷 뜻 → 영어
        </button>

        <button class="menu-button" onclick="startPractice('both')">
            🔄 둘 다
        </button>

        <button onclick="goHome()">← Home</button>
    </div>


    <!-- PRACTICE -->
    <div id="practiceScreen" class="hidden">

        <div class="progress" id="practiceProgress"></div>

        <h2 id="practiceQuestion"></h2>

        <div id="answerButtons"></div>

        <div class="feedback" id="feedback"></div>

        <button
            class="speaker-button hidden"
            id="soundButton"
            onclick="speakCurrentWord()">
            🔊 단어 듣기
        </button>

        <br>

        <button
            class="menu-button hidden"
            id="nextButton"
            onclick="nextPractice()">
            다음 문제 →
        </button>
    </div>


    <!-- RESULT -->
    <div id="resultScreen" class="hidden">

        <h2>🎉 Practice 완료!</h2>

        <p id="scoreText"></p>

        <h3>❌ 틀렸던 단어</h3>

        <div id="wrongWords"></div>

        <button
            class="menu-button"
            id="retryWrongButton"
            onclick="retryWrongWords()">
            🔄 틀린 단어 다시 공부하기
        </button>

        <button
            class="menu-button"
            onclick="goHome()">
            🏠 Home
        </button>
    </div>


    <!-- FAVORITES -->
    <div id="favoritesScreen" class="hidden">

        <h2>⭐ Favorites</h2>

        <p>헷갈리는 단어를 모아봤어요.</p>

        <div id="favoriteList"></div>

        <button onclick="goHome()">🏠 Home</button>
    </div>

</div>


<script>

    // ==========================
    // VOCABULARY
    // ==========================

    const vocabulary = {

        1: [
            {
                word: "small",
                meaning: "작은",
                example: "I have a small dog.",
                exampleMeaning: "나는 작은 강아지를 가지고 있다."
            },
            {
                word: "cold",
                meaning: "추운",
                example: "It is very cold today.",
                exampleMeaning: "오늘은 매우 춥다."
            },
            {
                word: "clean",
                meaning: "깨끗한",
                example: "My room is clean.",
                exampleMeaning: "내 방은 깨끗하다."
            },
            {
                word: "strong",
                meaning: "강한",
                example: "He is very strong.",
                exampleMeaning: "그는 매우 강하다."
            },
            {
                word: "quiet",
                meaning: "조용한",
                example: "The library is quiet.",
                exampleMeaning: "도서관은 조용하다."
            }
        ],

        2: [
            {
                word: "borrow",
                meaning: "빌리다",
                example: "Can I borrow your pen?",
                exampleMeaning: "네 펜을 빌려도 될까?"
            },
            {
                word: "invite",
                meaning: "초대하다",
                example: "I will invite my friend.",
                exampleMeaning: "나는 친구를 초대할 것이다."
            },
            {
                word: "continue",
                meaning: "계속하다",
                example: "Please continue your work.",
                exampleMeaning: "계속 일을 해 주세요."
            },
            {
                word: "discover",
                meaning: "발견하다",
                example: "They discovered a new place.",
                exampleMeaning: "그들은 새로운 장소를 발견했다."
            },
            {
                word: "describe",
                meaning: "묘사하다",
                example: "Can you describe the picture?",
                exampleMeaning: "그 그림을 묘사할 수 있니?"
            }
        ],

        3: [
            {
                word: "consume",
                meaning: "소비하다",
                example: "People consume a lot of water.",
                exampleMeaning: "사람들은 많은 물을 소비한다."
            },
            {
                word: "respond",
                meaning: "응답하다",
                example: "Please respond to my message.",
                exampleMeaning: "내 메시지에 응답해 주세요."
            },
            {
                word: "maintain",
                meaning: "유지하다",
                example: "We should maintain good habits.",
                exampleMeaning: "우리는 좋은 습관을 유지해야 한다."
            },
            {
                word: "reduce",
                meaning: "줄이다",
                example: "We need to reduce waste.",
                exampleMeaning: "우리는 쓰레기를 줄여야 한다."
            },
            {
                word: "influence",
                meaning: "영향을 미치다",
                example: "Friends can influence our choices.",
                exampleMeaning: "친구들은 우리의 선택에 영향을 줄 수 있다."
            }
        ],

        4: [
            {
                word: "essential",
                meaning: "필수적인",
                example: "Water is essential for life.",
                exampleMeaning: "물은 생명에 필수적이다."
            },
            {
                word: "accurate",
                meaning: "정확한",
                example: "The information is accurate.",
                exampleMeaning: "그 정보는 정확하다."
            },
            {
                word: "interpret",
                meaning: "해석하다",
                example: "We need to interpret the sentence.",
                exampleMeaning: "우리는 그 문장을 해석해야 한다."
            },
            {
                word: "sufficient",
                meaning: "충분한",
                example: "We have sufficient time.",
                exampleMeaning: "우리는 충분한 시간이 있다."
            },
            {
                word: "distinguish",
                meaning: "구별하다",
                example: "Can you distinguish the two words?",
                exampleMeaning: "두 단어를 구별할 수 있니?"
            }
        ],

        5: [
            {
                word: "coherent",
                meaning: "일관성 있는",
                example: "Her argument is coherent.",
                exampleMeaning: "그녀의 주장은 일관성이 있다."
            },
            {
                word: "allocate",
                meaning: "할당하다",
                example: "We need to allocate more time.",
                exampleMeaning: "우리는 더 많은 시간을 할당해야 한다."
            },
            {
                word: "controversial",
                meaning: "논란이 많은",
                example: "The topic is controversial.",
                exampleMeaning: "그 주제는 논란이 많다."
            },
            {
                word: "undergo",
                meaning: "겪다",
                example: "She had to undergo surgery.",
                exampleMeaning: "그녀는 수술을 받아야 했다."
            },
            {
                word: "facilitate",
                meaning: "촉진하다",
                example: "Technology can facilitate learning.",
                exampleMeaning: "기술은 학습을 촉진할 수 있다."
            }
        ]
    };


    // ==========================
    // VARIABLES
    // ==========================

    let currentLevel = 1;
    let currentStudyIndex = 0;

    let currentPracticeIndex = 0;
    let practiceType = "";
    let practiceQuestions = [];

    let score = 0;
    let wrongWords = [];
    let tried = false;

    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];


    // ==========================
    // SCREEN CONTROL
    // ==========================

    function hideAllScreens() {

        document.getElementById("homeScreen").classList.add("hidden");
        document.getElementById("studyLevelScreen").classList.add("hidden");
        document.getElementById("studyScreen").classList.add("hidden");
        document.getElementById("practiceLevelScreen").classList.add("hidden");
        document.getElementById("practiceTypeScreen").classList.add("hidden");
        document.getElementById("practiceScreen").classList.add("hidden");
        document.getElementById("resultScreen").classList.add("hidden");
        document.getElementById("favoritesScreen").classList.add("hidden");
    }


    function goHome() {

        hideAllScreens();

        document.getElementById("homeScreen").classList.remove("hidden");
    }


    // ==========================
    // WORD STUDY
    // ==========================

    function showStudyLevel() {

        hideAllScreens();

        document
            .getElementById("studyLevelScreen")
            .classList.remove("hidden");
    }


    function startStudy(level) {

        currentLevel = level;
        currentStudyIndex = 0;

        hideAllScreens();

        document
            .getElementById("studyScreen")
            .classList.remove("hidden");

        showStudyWord();
    }


    function showStudyWord() {

        const word = vocabulary[currentLevel][currentStudyIndex];

        document.getElementById("studyProgress").innerText =
            `${currentStudyIndex + 1} / ${vocabulary[currentLevel].length}`;

        document.getElementById("studyWord").innerText =
            word.word;

        document.getElementById("studyMeaning").innerText =
            word.meaning;

        document.getElementById("studyExample").innerText =
            word.example;

        document.getElementById("studyExampleMeaning").innerText =
            word.exampleMeaning;

        updateFavoriteButton();
    }


    function nextStudy() {

        if (
            currentStudyIndex <
            vocabulary[currentLevel].length - 1
        ) {
            currentStudyIndex++;
            showStudyWord();
        } else {
            alert("이 레벨의 단어를 모두 공부했어요! 🎉");
        }
    }


    function previousStudy() {

        if (currentStudyIndex > 0) {
            currentStudyIndex--;
            showStudyWord();
        }
    }


    // ==========================
    // SPEECH
    // ==========================

    function speakWord() {

        const word =
            vocabulary[currentLevel][currentStudyIndex].word;

        const speech =
            new SpeechSynthesisUtterance(word);

        speech.lang = "en-US";
        speech.rate = 0.8;

        window.speechSynthesis.speak(speech);
    }


    function speakExample() {

        const example =
            vocabulary[currentLevel][currentStudyIndex].example;

        const speech =
            new SpeechSynthesisUtterance(example);

        speech.lang = "en-US";
        speech.rate = 0.8;

        window.speechSynthesis.speak(speech);
    }


    function speakCurrentWord() {

        const word =
            practiceQuestions[currentPracticeIndex].word;

        const speech =
            new SpeechSynthesisUtterance(word);

        speech.lang = "en-US";
        speech.rate = 0.8;

        window.speechSynthesis.speak(speech);
    }


    // ==========================
    // FAVORITES
    // ==========================

    function getFavoriteKey(word) {

        return word.word;
    }


    function toggleFavorite() {

        const word =
            vocabulary[currentLevel][currentStudyIndex];

        const key = getFavoriteKey(word);

        if (favorites.includes(key)) {

            favorites =
                favorites.filter(item => item !== key);

        } else {

            favorites.push(key);
        }

        localStorage.setItem(
            "favorites",
            JSON.stringify(favorites)
        );

        updateFavoriteButton();
    }


    function updateFavoriteButton() {

        const word =
            vocabulary[currentLevel][currentStudyIndex];

        const key = getFavoriteKey(word);

        if (favorites.includes(key)) {

            document.getElementById(
                "favoriteButton"
            ).innerText = "★";

        } else {

            document.getElementById(
                "favoriteButton"
            ).innerText = "☆";
        }
    }


    function showFavorites() {

        hideAllScreens();

        document
            .getElementById("favoritesScreen")
            .classList.remove("hidden");

        const list =
            document.getElementById("favoriteList");

        list.innerHTML = "";

        if (favorites.length === 0) {

            list.innerHTML =
                "<p>아직 즐겨찾기한 단어가 없어요.</p>";

            return;
        }


        favorites.forEach(function(wordName) {

            let foundWord = null;

            for (let level in vocabulary) {

                const result =
                    vocabulary[level].find(
                        item => item.word === wordName
                    );

                if (result) {
                    foundWord = result;
                    break;
                }
            }


            if (foundWord) {

                const div =
                    document.createElement("div");

                div.className = "favorite-word";

                div.innerHTML = `
                    <strong>${foundWord.word}</strong>
                    <br>
                    ${foundWord.meaning}
                    <br><br>
                    ${foundWord.example}
                    <br>
                    ${foundWord.exampleMeaning}
                    <br>
                    <button
                        class="small-button"
                        onclick="speakFavorite('${foundWord.word}')">
                        🔊 Listen
                    </button>
                    <button
                        class="small-button"
                        onclick="removeFavorite('${foundWord.word}')">
                        ⭐ 즐겨찾기 해제
                    </button>
                `;

                list.appendChild(div);
            }
        });
    }


    function speakFavorite(word) {

        const speech =
            new SpeechSynthesisUtterance(word);

        speech.lang = "en-US";
        speech.rate = 0.8;

        window.speechSynthesis.speak(speech);
    }


    function removeFavorite(word) {

        favorites =
            favorites.filter(item => item !== word);

        localStorage.setItem(
            "favorites",
            JSON.stringify(favorites)
        );

        showFavorites();
    }


    // ==========================
    // PRACTICE
    // ==========================

    function showPracticeLevel() {

        hideAllScreens();

        document
            .getElementById("practiceLevelScreen")
            .classList.remove("hidden");
    }


    function choosePracticeType(level) {

        currentLevel = level;

        hideAllScreens();

        document
            .getElementById("practiceTypeScreen")
            .classList.remove("hidden");
    }


    function startPractice(type) {

        practiceType = type;

        practiceQuestions =
            [...vocabulary[currentLevel]];

        currentPracticeIndex = 0;
        score = 0;
        wrongWords = [];

        hideAllScreens();

        document
            .getElementById("practiceScreen")
            .classList.remove("hidden");

        showPracticeQuestion();
    }


    function showPracticeQuestion() {

        const question =
            practiceQuestions[currentPracticeIndex];

        tried = false;

        document.getElementById("practiceProgress").innerText =
            `${currentPracticeIndex + 1} / ${practiceQuestions.length}`;

        document.getElementById("feedback").innerText = "";

        document
            .getElementById("soundButton")
            .classList.add("hidden");

        document
            .getElementById("nextButton")
            .classList.add("hidden");


        let actualType = practiceType;

        if (practiceType === "both") {

            if (currentPracticeIndex % 2 === 0) {
                actualType = "engToKor";
            } else {
                actualType = "korToEng";
            }
        }


        if (actualType === "engToKor") {

            document.getElementById("practiceQuestion").innerText =
                question.word;

        } else {

            document.getElementById("practiceQuestion").innerText =
                question.meaning;
        }


        createAnswerButtons(actualType, question);
    }


    function createAnswerButtons(type, question) {

        const container =
            document.getElementById("answerButtons");

        container.innerHTML = "";

        let answers = [];


        if (type === "engToKor") {

            answers.push(question.meaning);

            while (answers.length < 3) {

                const randomWord =
                    practiceQuestions[
                        Math.floor(
                            Math.random() *
                            practiceQuestions.length
                        )
                    ].meaning;

                if (!answers.includes(randomWord)) {
                    answers.push(randomWord);
                }
            }

        } else {

            answers.push(question.word);

            while (answers.length < 3) {

                const randomWord =
                    practiceQuestions[
                        Math.floor(
                            Math.random() *
                            practiceQuestions.length
                        )
                    ].word;

                if (!answers.includes(randomWord)) {
                    answers.push(randomWord);
                }
            }
        }


        answers.sort(() => Math.random() - 0.5);


        answers.forEach(function(answer) {

            const button =
                document.createElement("button");

            button.className = "answer-button";

            button.innerText = answer;

            button.onclick = function() {

                checkAnswer(answer, type);
            };

            container.appendChild(button);
        });
    }


    function checkAnswer(answer, type) {

        const question =
            practiceQuestions[currentPracticeIndex];

        let correctAnswer;

        if (type === "engToKor") {
            correctAnswer = question.meaning;
        } else {
            correctAnswer = question.word;
        }


        if (answer === correctAnswer) {

            document.getElementById("feedback").innerText =
                "잘했어! 축하해! 🎉";

            if (!tried) {
                score++;
            }

            document
                .getElementById("soundButton")
                .classList.remove("hidden");

            document
                .getElementById("nextButton")
                .classList.remove("hidden");

        } else {

            if (!tried) {

                document.getElementById("feedback").innerText =
                    "다시 시도해봐! 💪";

                tried = true;

            } else {

                document.getElementById("feedback").innerText =
                    "정답은 " + correctAnswer + "이야!";

                if (
                    !wrongWords.includes(question.word)
                ) {
                    wrongWords.push(question.word);
                }

                document
                    .getElementById("soundButton")
                    .classList.remove("hidden");

                document
                    .getElementById("nextButton")
                    .classList.remove("hidden");
            }
        }
    }


    function nextPractice() {

        currentPracticeIndex++;

        if (
            currentPracticeIndex <
            practiceQuestions.length
        ) {

            showPracticeQuestion();

        } else {

            showResult();
        }
    }


    // ==========================
    // RESULT
    // ==========================

    function showResult() {

        hideAllScreens();

        document
            .getElementById("resultScreen")
            .classList.remove("hidden");

        document.getElementById("scoreText").innerText =
            `점수: ${score} / ${practiceQuestions.length}`;


        const wrongContainer =
            document.getElementById("wrongWords");

        wrongContainer.innerHTML = "";


        if (wrongWords.length === 0) {

            wrongContainer.innerHTML =
                "<p>모든 문제를 맞혔어요! 완벽해요! 🎉</p>";

            document
                .getElementById("retryWrongButton")
                .classList.add("hidden");

            return;
        }


        document
            .getElementById("retryWrongButton")
            .classList.remove("hidden");


        wrongWords.forEach(function(wordName) {

            let foundWord = null;

            for (let level in vocabulary) {

                const result =
                    vocabulary[level].find(
                        item => item.word === wordName
                    );

                if (result) {
                    foundWord = result;
                    break;
                }
            }


            if (foundWord) {

                const div =
                    document.createElement("div");

                div.className = "wrong-word";

                div.innerHTML = `
                    <strong>${foundWord.word}</strong>
                    <br>
                    ${foundWord.meaning}
                    <br>
                    <button
                        class="small-button"
                        onclick="speakFavorite('${foundWord.word}')">
                        🔊 Listen
                    </button>
                `;

                wrongContainer.appendChild(div);
            }
        });
    }


    // ==========================
    // RETRY WRONG WORDS
    // ==========================

    function retryWrongWords() {

        practiceQuestions =
            practiceQuestions.filter(function(word) {

                return wrongWords.includes(word.word);
            });

        currentPracticeIndex = 0;
        score = 0;
        wrongWords = [];

        hideAllScreens();

        document
            .getElementById("practiceScreen")
            .classList.remove("hidden");

        showPracticeQuestion();
    }

</script>

</body>
</html>
