<!DOCTYPE html>
<html>

<head>
    <title>나의 영어단어 학습 앱</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 30px;
            padding: 15px;
            margin: 10px;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "be good at" mean?</p>

    <button onclick="checkAnswer('participate')">
        Participate in
    </button>

    <button onclick="checkAnswer('avoid')">
        be good at
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "participate") {
                document.getElementById("feedback").innerText =
                    "잘했어!!";
            }

            else {
                document.getElementById("feedback").innerText =
                    " 틀렸어 ㅠㅠ 다시 해봐";
            }

        }

    </script>

</body>
</html>
