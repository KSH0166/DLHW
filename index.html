<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1, h2 {
            color: #3157a4;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            margin: 7px;
            font-size: 16px;
            cursor: pointer;
            background-color: #dce7ff;
            color: #3157a4;
        }

        button:hover {
            background-color: #c7d8ff;
        }

        .answer-button {
            display: block;
            width: 90%;
            margin: 12px auto;
            background-color: #eef3ff;
        }

        .answer-button:hover {
            background-color: #dce7ff;
        }

        .menu-button {
            display: block;
            width: 80%;
            margin: 15px auto;
            background-color: #3157a4;
            color: white;
        }

        .menu-button:hover {
            background-color: #264786;
        }

        .hidden {
            display: none;
        }

        .progress {
            color: #777;
            margin-bottom: 20px;
        }

        .word {
            font-size: 38px;
            font-weight: bold;
            color: #3157a4;
            margin: 30px 0;
        }

        .feedback {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 28px;
        }

        .sound-button {
            background-color: white;
            border: 1px solid #3157a4;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- QUIZ -->
    <div id="quizScreen">

        <h1>📝 Vocabulary Quiz</h1>

        <div class="progress" id="progress"></div>

        <div class="word" id="question"></div>

        <div id="answerButtons"></div>

        <div class="feedback" id="feedback"></div>

        <button
            class="sound-button hidden"
            id="soundButton"
            onclick="speakWord()">
            🔊 Listen
        </button>

        <br>

        <button
            class="menu-button hidden"
            id="nextButton"
            onclick="nextQuestion()">
            다음 →
        </button>

    </div>


    <!-- RESULT -->
    <div id="resultScreen" class="hidden">

        <h2>🎉 Quiz Complete!</h2>

        <p id="scoreText"></p>

        <p id="comment"></p>

        <button
            class="menu-button"
            onclick="restartQuiz()">
            🔄 다시 풀기
        </button>

    </div>

</div>


<script>

    // ==============================
    // 5개의 단어
    // ==============================

    const vocabulary = [

        {
            word: "small",
            meaning: "작은"
        },

        {
            word: "borrow",
            meaning: "빌리다"
        },

        {
            word: "maintain",
            meaning: "유지하다"
        },

        {
            word: "sufficient",
            meaning: "충분한"
        },

        {
            word: "facilitate",
            meaning: "촉진하다"
        }

    ];


    // ==============================
    // 변수
    // ==============================

    let currentQuestion = 0;

    let score = 0;

    let tried = false;


    // ==============================
    // 문제 표시
    // ==============================

    function showQuestion() {

        const question =
            vocabulary[currentQuestion];

        tried = false;


        document.getElementById("progress")
            .innerText =
            `${currentQuestion + 1} / ${vocabulary.length}`;


        document.getElementById("question")
            .innerText =
            question.word;


        document.getElementById("feedback")
            .innerText = "";


        document.getElementById("soundButton")
            .classList.add("hidden");


        document.getElementById("nextButton")
            .classList.add("hidden");


        createAnswerButtons(question);

    }


    // ==============================
    // 보기 만들기
    // ==============================

    function createAnswerButtons(question) {

        const container =
            document.getElementById("answerButtons");

        container.innerHTML = "";


        let answers = [];

        answers.push(question.meaning);


        while (answers.length < 3) {

            const randomWord =
                vocabulary[
                    Math.floor(
                        Math.random() *
                        vocabulary.length
                    )
                ];


            if (
                !answers.includes(
                    randomWord.meaning
                )
            ) {

                answers.push(
                    randomWord.meaning
                );

            }

        }


        answers.sort(
            () => Math.random() - 0.5
        );


        answers.forEach(function(answer) {

            const button =
                document.createElement("button");


            button.className =
                "answer-button";


            button.innerText =
                answer;


            button.onclick =
                function() {

                    checkAnswer(answer);

                };


            container.appendChild(button);

        });

    }


    // ==============================
    // 정답 확인
    // ==============================

    function checkAnswer(answer) {

        const question =
            vocabulary[currentQuestion];


        if (answer === question.meaning) {

            document.getElementById("feedback")
                .innerText =
                "Great job! 🎉";


            if (!tried) {

                score++;

            }


            document.getElementById("soundButton")
                .classList.remove("hidden");


            document.getElementById("nextButton")
                .classList.remove("hidden");


        } else {

            if (!tried) {

                document.getElementById("feedback")
                    .innerText =
                    "Try again! 💪";

                tried = true;

            } else {

                document.getElementById("feedback")
                    .innerText =
                    `The answer is "${question.meaning}".`;


                document.getElementById("soundButton")
                    .classList.remove("hidden");


                document.getElementById("nextButton")
                    .classList.remove("hidden");

            }

        }

    }


    // ==============================
    // 단어 듣기
    // ==============================

    function speakWord() {

        const word =
            vocabulary[currentQuestion].word;


        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(word);


        speech.lang = "en-US";

        speech.rate = 0.8;

        window.speechSynthesis.speak(speech);

    }


    // ==============================
    // 다음 문제
    // ==============================

    function nextQuestion() {

        currentQuestion++;


        if (
            currentQuestion <
            vocabulary.length
        ) {

            showQuestion();

        } else {

            showResult();

        }

    }


    // ==============================
    // 결과
    // ==============================

    function showResult() {

        document.getElementById("quizScreen")
            .classList.add("hidden");


        document.getElementById("resultScreen")
            .classList.remove("hidden");


        document.getElementById("scoreText")
            .innerText =
            `Score: ${score} / ${vocabulary.length}`;


        if (score === 5) {

            document.getElementById("comment")
                .innerText =
                "Excellent! You got all the answers right! 🎉";

        } else if (score >= 3) {

            document.getElementById("comment")
                .innerText =
                "Good job! Keep practicing! 💪";

        } else {

            document.getElementById("comment")
                .innerText =
                "Keep practicing and try again! 📚";

        }

    }


    // ==============================
    // 다시 풀기
    // ==============================

    function restartQuiz() {

        currentQuestion = 0;

        score = 0;

        document.getElementById("resultScreen")
            .classList.add("hidden");


        document.getElementById("quizScreen")
            .classList.remove("hidden");


        showQuestion();

    }


    // ==============================
    // 시작
    // ==============================

    showQuestion();

</script>

</body>
</html>
